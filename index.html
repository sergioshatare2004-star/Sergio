<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>¿Quieres ser mi San Valentín? ❤️</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Poppins', sans-serif;
}

body {
  height: 100vh;
  background: linear-gradient(135deg, #ff758c, #ff7eb3);
  overflow: hidden;
  display: flex;
  justify-content: center;
  align-items: center;
}

/* Corazones flotando */
.heart {
  position: absolute;
  color: rgba(255,255,255,0.6);
  font-size: 20px;
  animation: float 6s linear infinite;
}

@keyframes float {
  0% {
    transform: translateY(100vh) scale(1);
    opacity: 1;
  }
  100% {
    transform: translateY(-10vh) scale(1.5);
    opacity: 0;
  }
}

/* Tarjeta */
.card {
  background: rgba(255,255,255,0.95);
  padding: 40px;
  border-radius: 25px;
  max-width: 420px;
  text-align: center;
  box-shadow: 0 20px 40px rgba(0,0,0,0.2);
  animation: fadeIn 1.5s ease;
}

@keyframes fadeIn {
  from {
    opacity: 0;
    transform: scale(0.8);
  }
  to {
    opacity: 1;
    transform: scale(1);
  }
}

.card h1 {
  font-size: 2.2rem;
  color: #ff4f81;
  margin-bottom: 15px;
}

.card p {
  font-size: 1.1rem;
  color: #555;
  margin-bottom: 25px;
  line-height: 1.6;
}

/* Botón */
.btn {
  background: linear-gradient(135deg, #ff4f81, #ff758c);
  color: #fff;
  border: none;
  padding: 14px 35px;
  font-size: 1.1rem;
  border-radius: 30px;
  cursor: pointer;
  transition: all 0.3s ease;
}

.btn:hover {
  transform: scale(1.1);
  box-shadow: 0 10px 20px rgba(255,79,129,0.4);
}

/* Mensaje final */
.message {
  display: none;
  margin-top: 25px;
  font-size: 1.2rem;
  color: #ff4f81;
  animation: pop 0.6s ease;
}

@keyframes pop {
  0% {
    transform: scale(0.5);
    opacity: 0;
  }
  100% {
    transform: scale(1);
    opacity: 1;
  }
}

/* Emoji grande */
.emoji {
  font-size: 3rem;
  margin-bottom: 15px;
}
</style>
</head>

<body>

<div class="card">
  <div class="emoji">💖</div>
  <h1>Para la persona más especial</h1>
  <p>
    Desde que llegaste a mi vida, todo es más bonito.<br>
    Cada sonrisa tuya es mi lugar favorito.
  </p>

  <button class="btn" onclick="mostrarMensaje()">¿Quieres ser mi San Valentín? 💌</button>

  <div class="message" id="mensaje">
    ✨ Prometo risas, abrazos infinitos y muchos momentos juntos 💕
  </div>
</div>

<script>
function mostrarMensaje() {
  document.getElementById("mensaje").style.display = "block";
}

// Crear corazones flotantes
function crearCorazon() {
  const heart = document.createElement("div");
  heart.classList.add("heart");
  heart.innerHTML = "❤️";
  heart.style.left = Math.random() * 100 + "vw";
  heart.style.fontSize = Math.random() * 20 + 15 + "px";
  heart.style.animationDuration = Math.random() * 3 + 4 + "s";

  document.body.appendChild(heart);

  setTimeout(() => {
    heart.remove();
  }, 6000);
}

setInterval(crearCorazon, 300);
</script>

</body>
</html>
